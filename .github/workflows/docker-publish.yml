name: Publish Docker Image

on:
  # Run only after the PyPI publish workflow succeeds — the Dockerfile
  # installs synthadoc from PyPI, so Docker must start after PyPI is live.
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  # Manual trigger: useful for retries and hotfixes without a new PyPI release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build, without the v prefix (e.g. 1.4.2)'
        required: true
        type: string

env:
  IMAGE: chenp/synthadoc

jobs:
  build-and-push:
    # Skip if the PyPI publish failed or was cancelled (workflow_run path only).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: Docker Hub
      url: https://hub.docker.com/r/chenp/synthadoc/tags
    permissions:
      contents: read
      packages: write   # needed if also pushing to ghcr.io

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run sets head_sha; workflow_dispatch falls back to the triggering commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0   # fetch all tags so git describe can find the release tag

      - name: Extract version
        id: version
        # workflow_dispatch: use the input directly.
        # workflow_run: GITHUB_REF_NAME is not set; derive the tag from the commit.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(git describe --tags --exact-match HEAD)
            echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the release to be installable from PyPI
        # PyPI's CDN can lag a few minutes behind a successful upload; without
        # this wait, `pip install synthadoc==<version>` in the Dockerfile can fail.
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          for i in $(seq 1 30); do
            if python3 -m pip download --no-deps --no-cache-dir -q -d /tmp/pypi-check "synthadoc==${VERSION}"; then
              echo "synthadoc==${VERSION} is available on PyPI"
              exit 0
            fi
            echo "synthadoc==${VERSION} not on PyPI yet (attempt ${i}/30); retrying in 20s"
            sleep 20
          done
          echo "synthadoc==${VERSION} never became available on PyPI" >&2
          exit 1

      - name: Set up QEMU
        # Required to build the linux/arm64 image on an amd64 runner.
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag with the exact version and update :latest
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          # Pin the exact release version so the image matches the git tag.
          build-args: |
            SYNTHADOC_VERSION=${{ steps.version.outputs.tag }}
          # Build for both amd64 (Linux servers) and arm64 (Apple Silicon, Graviton)
          platforms: linux/amd64,linux/arm64
